baseURL: https://krispointluogu.github.io/
locale: zh-cn
title: KrisPoint
theme: PaperMod

enableEmoji: true
enableRobotsTXT: true

pagination:
  pagerSize: 10

languages:
  zh:
    label: 中文
    weight: 1

params:
  author: KrisPoint
  description: KrisPoint的个人blog和随笔
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true

  profileMode:
    enabled: true
    title: My Wilderness
    subtitle: 记录、思考、探索
    imageUrl: /images/avatar.png
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: 旷野
        url: /posts/
      - name: 关于
        url: /about/

  socialIcons:
    - name: github
      url: https://github.com/KrisPointLuogu
    - name: email
      url: 3631313260@qq.com

menu:
  main:
    - identifier: posts
      name: 随笔
      url: /posts/
      weight: 10
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
    - identifier: goals
      name: 目标
      url: /goals/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 50
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60

outputs:
  home:
    - HTML
    - RSS
    - JSON
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
